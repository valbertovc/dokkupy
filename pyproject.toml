[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "dokkupy"
version = "0.4.1"
description = "Python API and script for dokku"
readme = "README.rst"
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.7"
authors = [
    { name = "Rodrigo Pinheiro Marques de Araújo", email = "fenrrir@gmail.com" },
]
keywords = ["python", "dokkupy", "dokku"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "GitPython>=3.1.30",
]

[project.urls]
Homepage = "https://github.com/fenrrir/dokkupy"
Repository = "https://github.com/fenrrir/dokkupy.git"
Issues = "https://github.com/fenrrir/dokkupy/issues"

[project.scripts]
dokkupycli = "dokkupy.cli:main"
